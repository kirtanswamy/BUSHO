        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112120000_durable_provisioning_operations.sql

      - name: Apply provisioning reconciliation payload migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112130000_provisioning_reconciliation_payload.sql

      - name: Apply BUSHO SHC-to-PHC stockout workflow migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114120000_busho_shc_phc_stockout_foundation.sql

      - name: Audit exposed-schema RLS, grants and SECURITY DEFINER helpers
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-security-audit.sql

      - name: Verify worker, supervisor, admin and stock workflows under RLS
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-rls-contract.sql

      - name: Verify SHC-to-PHC stockout workflow under RLS
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-stockout-workflow-contract.sql
