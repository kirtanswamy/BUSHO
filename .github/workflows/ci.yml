        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261111220000_replenishment_submission_idempotency.sql

      - name: Grant supervisor replenishment submission key
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261111230000_grant_replenishment_submission_key.sql

      - name: Apply durable provisioning operations migration
