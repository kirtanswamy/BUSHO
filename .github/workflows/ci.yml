name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check

  database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: busho_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase-compatible legacy schema
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres-bootstrap.sql
      - name: Apply BUSHO legacy schema baseline
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106180000_legacy_schema_baseline.sql
      - name: Apply BUSHO operational security migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106190000_busho_operational_security_foundation.sql
      - name: Apply BUSHO supervisor report-item correction migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107051839_busho_supervisor_report_item_corrections.sql
      - name: Apply BUSHO database query tuning migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107060000_busho_database_query_tuning.sql
      - name: Apply BUSHO facility registry review migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107170000_facility_registry_review_workflow.sql
      - name: Apply BUSHO role and report policy alignment migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107190000_busho_role_policy_alignment.sql
      - name: Apply BUSHO medicine reference catalogue migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107200000_medicine_reference_catalogue.sql
      - name: Apply BUSHO storekeeper separation migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107230000_busho_storekeeper_separation.sql
      - name: Apply BUSHO inventory movement ledger migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107233000_busho_inventory_movement_ledger.sql
      - name: Apply BUSHO inventory snapshot source-role guard migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261108090000_busho_inventory_snapshot_source_role_guard.sql

      - name: Apply BUSHO clarification return authorization migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261110114226_restrict_replenishment_clarification_returns.sql

      - name: Apply BUSHO replenishment insert integrity migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261111190000_replenishment_insert_integrity.sql

      - name: Apply BUSHO replenishment guard deduplication migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261111200000_replenishment_guard_deduplication.sql

      - name: Apply BUSHO replenishment quantity guard migration
        env:
          DATABASE_URL: postgres://postgres:busho_test_password@localhost:5432/postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261111210000_replenishment_quantity_guard.sql

      - name: Apply BUSHO replenishment submission idempotency migration
        env:
