name: Bug report
description: Report a reproducible problem in the BUSHO prototype.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data only. Never include patient names, phone numbers, diagnoses, government IDs, or other personal information."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the demo…"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console errors
      description: Remove all personal or sensitive information before attaching.
