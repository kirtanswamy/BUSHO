<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">BUSHO — Bottom-Up Smart Health Orchestrator</title>
  <desc id="desc">A visual identity for BUSHO, a human-centred first-mile health reporting prototype.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092c2b"/>
      <stop offset="0.55" stop-color="#0d4540"/>
      <stop offset="1" stop-color="#102e39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ee6c7"/>
      <stop offset="1" stop-color="#54c7b1"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#d5fff4" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="30" fill="url(#grid)"/>
  <circle cx="1320" cy="120" r="180" fill="#55c9b1" opacity=".08"/>
  <circle cx="1320" cy="120" r="112" fill="#55c9b1" opacity=".08" filter="url(#glow)"/>
  <g transform="translate(1110 92)">
    <path d="M70 0v76M32 38h76" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="70" cy="38" r="91" fill="none" stroke="#a5ead2" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="70" cy="38" r="122" fill="none" stroke="#a5ead2" stroke-opacity=".13" stroke-width="2" stroke-dasharray="5 12"/>
  </g>
  <g fill="none" stroke="#9ce4cc" stroke-opacity=".7" stroke-width="3">
    <path d="M1090 300H1235L1300 250H1450"/>
    <path d="M1150 365H1260L1325 315H1490"/>
    <path d="M1215 430H1320L1380 380H1515"/>
  </g>
  <g fill="#9ce4cc">
    <circle cx="1090" cy="300" r="6"/><circle cx="1450" cy="250" r="6"/>
    <circle cx="1150" cy="365" r="6"/><circle cx="1490" cy="315" r="6"/>
    <circle cx="1215" cy="430" r="6"/><circle cx="1515" cy="380" r="6"/>
  </g>
  <g transform="translate(112 112)">
    <rect x="0" y="0" width="7" height="34" rx="3.5" fill="#63d3b8"/>
    <rect x="17" y="-13" width="7" height="47" rx="3.5" fill="#8ce2c8"/>
    <rect x="34" y="-27" width="7" height="61" rx="3.5" fill="#b2f0d8"/>
  </g>
  <text x="112" y="235" fill="#f2fff9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="104" font-weight="750" letter-spacing="5">BUSHO</text>
  <text x="116" y="282" fill="#a9e6d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="4">BOTTOM-UP SMART HEALTH ORCHESTRATOR</text>
  <path d="M116 322H760" stroke="#83ddc4" stroke-opacity=".45" stroke-width="2"/>
  <text x="116" y="374" fill="#e2f7ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="500">From frontline notes to verified action.</text>
  <text x="116" y="419" fill="#b4d8cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">A human-centred prototype for health reporting and medicine-stock coordination.</text>
  <g transform="translate(116 457)">
    <rect width="174" height="34" rx="17" fill="#b2f0d8" fill-opacity=".14" stroke="#9de7ce" stroke-opacity=".45"/>
    <circle cx="18" cy="17" r="5" fill="#8fe2c6"/>
    <text x="33" y="22" fill="#dffaf0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">HUMAN VERIFIED</text>
    <rect x="188" width="142" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="209" y="22" fill="#d5e8e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1">SYNTHETIC DEMO</text>
  </g>
