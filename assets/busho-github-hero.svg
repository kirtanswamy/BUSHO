 <text x="771" y="362" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#eafff7">03 / HUMAN CONFIRMATION</text>
 <text x="771" y="385" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#a8d8cf">Worker reviews, corrects and confirms the record</text>
