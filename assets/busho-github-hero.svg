 <text x="731" y="461" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#f1d39a">04 / STOCK ATTENTION</text><text x="731" y="483" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#d6c7a9">Synthetic inventory only</text>
 <rect x="942" y="435" width="230" height="70" rx="14" fill="#1c3046" stroke="#6baee0" stroke-opacity=".7"/>
 <text x="961" y="461" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#9bd4ff">05 / SUPERVISOR REVIEW</text><text x="961" y="483" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c1d8e8">Draft action • no order placed</text>
