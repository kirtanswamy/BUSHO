<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">BUSHO — From community signal to coordinated response</title>
<desc id="desc">A dark navy and teal illustration showing a frontline field report moving through human verification to a supervisor's review queue, with a medicine stock attention signal. It is a conceptual illustration of the BUSHO prototype, not a live system.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071521"/><stop offset=".55" stop-color="#102b3c"/><stop offset="1" stop-color="#123e4a"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ce4c5"/><stop offset="1" stop-color="#6bbcff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18384b"/><stop offset="1" stop-color="#10293a"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020b12" flood-opacity=".38"/></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8cc8d0" stroke-opacity=".07" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="640" rx="30" fill="url(#bg)"/>
<rect width="1280" height="640" rx="30" fill="url(#grid)"/>
<circle cx="1110" cy="40" r="250" fill="#5fe0c0" opacity=".06"/><circle cx="110" cy="600" r="210" fill="#62b8ff" opacity=".06"/>
<text x="72" y="78" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#73e5cc">BUSHO  /  BOTTOM-UP SMART HEALTH ORCHESTRATOR</text>
<text x="72" y="151" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#f4fbff">Make the first mile</text>
<text x="72" y="211" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#f4fbff">of health information</text>
<text x="72" y="271" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#73e5cc">work better.</text>
<text x="76" y="322" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#c4d7e1">A human-reviewed workflow for frontline reporting</text>
<text x="76" y="352" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#c4d7e1">and medicine-stock coordination.</text>
<rect x="76" y="396" width="214" height="43" rx="21" fill="#173f4a" stroke="#5bd9bd" stroke-opacity=".65"/>
<circle cx="99" cy="417" r="5" fill="#71e6c8"/><text x="114" y="423" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#e9fffa">PROTOTYPE • NOT LIVE</text>
<text x="76" y="492" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8faebd">REPORT  →  VERIFY  →  REVIEW  →  COORDINATE</text>
