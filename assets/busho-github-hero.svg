<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
<title id="title">BUSHO — Bottom-Up Smart Health Orchestrator</title>
<desc id="desc">A conceptual illustration of an ASHA worker using a phone at a primary health centre, with a human-reviewed sample report workflow. BUSHO is a prototype.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#031719"/><stop offset=".55" stop-color="#073b3b"/><stop offset="1" stop-color="#071b25"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79f4d1"/><stop offset="1" stop-color="#27c6a2"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183e43"/><stop offset="1" stop-color="#0b272f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#1bc6a1" stop-opacity=".3"/><stop offset="1" stop-color="#1bc6a1" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#76e8ce" opacity=".25"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1440" height="600" rx="28" fill="url(#bg)"/>
<rect width="800" height="600" rx="28" fill="url(#dots)" opacity=".45"/>
<ellipse cx="1080" cy="280" rx="440" ry="350" fill="url(#glow)"/>
<path d="M770 0 C700 150 720 430 835 600" stroke="#24c9a7" stroke-opacity=".45" stroke-width="2" fill="none"/>
<g transform="translate(76 43)">
 <rect x="0" y="5" width="22" height="58" rx="11" fill="#f4fffc"/><rect x="-18" y="23" width="58" height="22" rx="11" fill="url(#mint)"/>
 <text x="62" y="40" fill="#f4fffc" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="800">BUSHO</text>
 <text x="64" y="68" fill="#a8d9d0" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing=".8">BOTTOM-UP SMART HEALTH ORCHESTRATOR</text>
</g>
<rect x="1095" y="42" width="270" height="42" rx="21" fill="#e8f4f3" opacity=".96"/>
<text x="1230" y="68" text-anchor="middle" fill="#12353a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">DIGITAL PUBLIC HEALTH PROTOTYPE</text>
<text x="76" y="164" fill="#f7fffd" font-family="Inter,Arial,sans-serif" font-size="47" font-weight="800">From field reports to</text>
<text x="76" y="218" fill="#f7fffd" font-family="Inter,Arial,sans-serif" font-size="47" font-weight="800">actionable <tspan fill="#69e8c7">health insights.</tspan></text>
<text x="78" y="263" fill="#d0e4df" font-family="Inter,Arial,sans-serif" font-size="18">A human-reviewed workflow to structure frontline reports,</text>
<text x="78" y="289" fill="#d0e4df" font-family="Inter,Arial,sans-serif" font-size="18">organize facility needs and support supervisor review.</text>
<rect x="76" y="320" width="265" height="100" rx="17" fill="#172b32" stroke="#78685e"/>
<text x="98" y="351" fill="#ff987d" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">THE CHALLENGE</text>
<text x="98" y="379" fill="#f0f6f4" font-family="Inter,Arial,sans-serif" font-size="15">Reports can lose context</text><text x="98" y="401" fill="#f0f6f4" font-family="Inter,Arial,sans-serif" font-size="15">between field and facility.</text>
<path d="M357 370h38m-10 -10 10 10 -10 10" stroke="#e4fff8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="410" y="320" width="322" height="100" rx="17" fill="#0b4945" stroke="#26d4ae" stroke-width="1.5"/>
<text x="434" y="351" fill="#70f0ce" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">THE BUSHO APPROACH</text>
<text x="434" y="379" fill="#f0fffb" font-family="Inter,Arial,sans-serif" font-size="15">Capture, structure, verify and</text><text x="434" y="401" fill="#f0fffb" font-family="Inter,Arial,sans-serif" font-size="15">surface reports for supervisors.</text>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
 <g transform="translate(116 470)" fill="none" stroke="#60e8c8" stroke-width="2"><circle r="17"/><path d="M-8 -4h16v11h-7l-5 5v-5h-4z"/></g><text x="116" y="507" fill="#e5f8f3" font-size="13">VOICE &amp; TEXT</text>
 <g transform="translate(267 470)" fill="none" stroke="#60e8c8" stroke-width="2"><path d="M-15 -13h30v26h-30zM-8 -6h16M-8 0h13M-8 6h8"/></g><text x="267" y="507" fill="#e5f8f3" font-size="13">LOCAL LANGUAGES</text>
 <g transform="translate(430 470)" fill="none" stroke="#60e8c8" stroke-width="2"><path d="M0 -17 17 -8 0 2 -17 -8zM-17 0 0 10 17 0M-17 8 0 18 17 8"/></g><text x="430" y="507" fill="#e5f8f3" font-size="13">STRUCTURED DRAFTS</text>
 <g transform="translate(590 470)" fill="none" stroke="#60e8c8" stroke-width="2"><rect x="-14" y="-14" width="28" height="28" rx="4"/><path d="M-7 -5h14M-7 1h14M-7 7h9"/></g><text x="590" y="507" fill="#e5f8f3" font-size="13">HUMAN REVIEW</text>
</g>
