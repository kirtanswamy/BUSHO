<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">BUSHO prototype workflow</title>
<desc id="desc">A five-step conceptual workflow: sample field report, mock extraction, human review, synthetic inventory attention, and administrator-reviewed draft.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1d2f"/><stop offset="1" stop-color="#173956"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4bd3c3"/><stop offset="1" stop-color="#5ca9ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#071321" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<circle cx="1070" cy="35" r="145" fill="#4bd3c3" opacity=".06"/><circle cx="40" cy="400" r="150" fill="#5ca9ff" opacity=".06"/>
<text x="56" y="62" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#6fe0d2">BUSHO / PROTOTYPE FLOW</text>
<text x="56" y="103" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">From frontline report to reviewed action</text>
<text x="56" y="132" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#c4d5e4">A human-in-the-loop workflow using synthetic demo data</text>
